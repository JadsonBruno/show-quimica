<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1c2541"><title>Show da Química</title><style>
:root{--paper:#f5f0e5;--card:#fffdf6;--ink:#1c2541;--text:#34406a;--muted:#6b7191;--shadow:#ddd4c3;--warm:#ffe4a6;--gold:#f2b63c;--ok:#2f9a54;--okbg:#d6f3df;--bad:#c23a30;--badbg:#ffe1dc;--stage:#1c2541;--stage2:#2b3a67;
  --hand:"Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive;--sans:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
#app{max-width:560px;margin:0 auto;padding:10px 12px calc(28px + env(safe-area-inset-bottom))}
.stage{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--stage2),var(--stage));color:#fffdf6;border-radius:20px;border:1.5px solid var(--ink);box-shadow:3px 4px 0 var(--shadow);padding:12px 14px;margin-bottom:10px}
.stage.home{padding:22px 16px 18px;text-align:center;display:grid;gap:10px;justify-items:center}
.stage.home::before{content:"";position:absolute;inset:-40% -20% auto;height:120%;background:repeating-conic-gradient(from 0deg at 50% 0%,rgba(242,182,60,.10) 0 6deg,transparent 6deg 18deg);pointer-events:none}
.logo{position:relative;display:grid;gap:2px}
.logo small{font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.logo b{font:700 34px/1.05 var(--hand);color:#fffdf6;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo b.nota{font-size:64px;color:var(--gold)}
.logo i{font:600 14px var(--sans);color:#cfd4e6;font-style:normal}
.lead{position:relative;margin:0;font-size:15px;color:#e8ebf5;max-width:34ch}
.go{position:relative;width:100%;min-height:54px;border:2px solid var(--ink);border-radius:999px;background:var(--gold);color:var(--ink);font:700 19px var(--hand);box-shadow:0 4px 0 #b9831f}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #b9831f}
.ghost{position:relative;width:100%;min-height:48px;border:1.5px solid #fffdf6;border-radius:999px;background:transparent;color:#fffdf6;font:700 16px var(--sans)}
.card .ghost,.panel .ghost{border-color:var(--ink);color:var(--ink);background:#fff}
.ghost:disabled{opacity:.4}
.link{border:0;background:none;padding:8px;font:700 14px var(--sans);color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link.light{color:#cfd4e6}
.best{position:relative;font:600 14px var(--sans);color:#cfd4e6}
.best b{color:var(--gold)}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--shadow);padding:14px;margin-bottom:10px}
.card h2{margin:0 0 6px;font:700 20px/1.2 var(--hand);color:var(--ink)}
.rules{margin:0;padding-left:18px;display:grid;gap:6px;font-size:15px}
details summary{margin-top:8px;font:700 14px var(--sans);color:var(--ink);padding:6px 0}
.tri{margin:10px 0 0;padding:10px 12px;border-radius:12px;border:1.5px dashed var(--ink);background:#fff6dc;font:500 13px/1.45 var(--sans);color:var(--text)}
.tri.small{font-size:12px;margin-top:8px}
.foot{text-align:center;margin:4px 0}
/* escada */
.ladder{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px}
.ladder li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:4px 10px;border-radius:10px;background:#eef0f6;font:700 14px var(--sans);color:var(--ink)}
.ladder li span{font-size:12px;color:var(--muted)}
.ladder li em{font:700 11px var(--sans);font-style:normal;color:#8a5a00;background:var(--warm);border:1px solid var(--ink);border-radius:999px;padding:1px 8px}
.ladder li[data-safe]{background:#fff1cc}
.ladder li[data-done]{opacity:.55}
.ladder li[data-cur]{background:var(--ink);color:#fffdf6}
.ladder li[data-cur] span{color:var(--gold)}
/* jogo */
.stage.game{padding:10px 12px}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px}
.status.review{font:700 15px var(--sans)}
.stepinfo b{font:700 20px var(--hand);color:#fffdf6;margin-right:6px}
.stepinfo span{font:600 13px var(--sans);color:#cfd4e6}
.ladderbtn{border:1.5px solid var(--gold);background:transparent;color:var(--gold);border-radius:999px;padding:6px 12px;font:700 13px var(--sans);min-height:36px}
.track{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:8px 0}
.track i{height:7px;border-radius:4px;background:rgba(255,255,255,.18)}
.track i[data-safe]{box-shadow:0 0 0 1.5px var(--gold)}
.track i[data-done]{background:var(--ok)}
.track i[data-cur]{background:var(--gold)}
.prize{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px}
.prize div{display:grid;justify-items:center;padding:4px 2px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
.prize small{font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#cfd4e6}
.prize b{font:700 20px var(--hand);color:#fffdf6}
.prize .win{background:var(--gold);border-color:var(--gold)}
.prize .win small,.prize .win b{color:var(--ink)}
.qcard{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--shadow);padding:12px;margin-bottom:10px}
.pat{margin:0;font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.qtext{margin:2px 0 8px;font:700 19px/1.3 var(--sans);color:var(--ink)}
.figs{display:grid;gap:8px;margin-bottom:8px}
.figs.n2{grid-template-columns:1fr 1fr}
.fig{margin:0;border:1.5px solid var(--ink);border-radius:14px;background:#fbf7ec;padding:6px;display:grid;align-content:center}
.fig .mol svg{display:block;width:100%;height:auto;max-height:200px;margin:0 auto}
.figs.n2 .fig .mol svg{max-height:150px}
.fig figcaption{margin-top:2px;text-align:center;font:600 13px/1.3 var(--sans);color:var(--muted)}
.alts{display:grid;gap:8px}
.alts.grid{grid-template-columns:1fr 1fr}
.alt{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 12px 8px 8px;border:1.5px solid var(--ink);border-radius:16px;background:#fff;box-shadow:2px 3px 0 var(--shadow);text-align:left;color:var(--ink);transition:background .2s,transform .2s}
.alt i{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--gold);font:700 17px var(--hand);font-style:normal}
.alttxt{font:700 16px/1.25 var(--sans)}
.alt.isfig{flex-direction:column;align-items:stretch;gap:2px;padding:30px 6px 6px;min-height:120px}
.alt.isfig i{position:absolute;left:6px;top:6px;width:28px;height:28px;font-size:15px}
.altfig svg{display:block;width:100%;height:auto;max-height:118px;margin:0 auto}
.alt.isfig small{text-align:center;font:600 12px/1.25 var(--sans);color:var(--muted)}
.alts.long{grid-template-columns:1fr}
.alts.long .alt.isfig{flex-direction:row;align-items:center;gap:10px;padding:6px 10px 6px 8px;min-height:78px}
.alts.long .alt.isfig i{position:static;width:34px;height:34px}
.alts.long .altfig{flex:1}
.alts.long .altfig svg{max-height:92px}
.alts.long .alt.isfig small{flex:none;max-width:38%;text-align:right}
.alt[data-state="pick"]{background:var(--warm);animation:pulse 1s infinite}
.alt[data-state="right"]{background:var(--okbg);border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.alt[data-state="right"] i{background:var(--ok);color:#fff}
.alt[data-state="wrong"]{background:var(--badbg);border-color:var(--bad)}
.alt[data-state="wrong"] i{background:var(--bad);color:#fff}
.alt[data-gone]{opacity:.22;filter:grayscale(1)}
.alt[data-gone]::after{content:"";position:absolute;left:10px;right:10px;top:50%;border-top:2.5px solid var(--bad);transform:rotate(-4deg)}
.qcard[data-phase="reveal"] .alt:not([data-state]){opacity:.55}
.qcard[data-phase="reveal"] .alt[data-state=""]{opacity:.55}
@keyframes pulse{50%{transform:scale(1.02)}}
.helps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.helps button{display:grid;justify-items:center;gap:1px;padding:6px 2px;border:1.5px solid var(--ink);border-radius:14px;background:#fff;box-shadow:2px 2px 0 var(--shadow);font:700 12px/1.15 var(--sans);color:var(--ink);min-height:64px}
.helps small{font:600 10px var(--sans);color:var(--muted)}
.helps .ic svg{width:24px;height:24px;display:block}
.helps button:disabled{opacity:.35;box-shadow:none}
.stop{width:100%;min-height:48px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:700 16px var(--sans);box-shadow:2px 3px 0 var(--shadow)}
.bubble{margin:0 0 8px;padding:9px 12px;border-radius:14px;border:1.5px solid var(--ink);font:600 14px/1.4 var(--sans);color:var(--ink)}
.bubble.prof{background:#fff1cc}
.bubble.uni{background:#e6ecff}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font:700 12px var(--sans)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-2px;border:1.2px solid var(--ink)}
.hintring{animation:ring 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{50%{transform:scale(1.15);opacity:.6}}
.verdict{margin-top:10px;padding:10px 12px;border-radius:14px;border:2px solid;display:grid;gap:3px;animation:pop .35s ease}
.verdict b{font:700 21px var(--hand)}
.verdict span{font:600 15px/1.4 var(--sans);color:var(--ink)}
.verdict small{font:600 12px var(--sans);color:var(--muted)}
.verdict.ok{border-color:var(--ok);background:var(--okbg)}.verdict.ok b{color:#1f6b3a}
.verdict.bad{border-color:var(--bad);background:var(--badbg)}.verdict.bad b{color:var(--bad)}
.qcard .go{margin-top:10px}
.qcard .link{display:block;margin:6px auto 0}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(28,37,65,.35);padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.sheet.dim{background:rgba(28,37,65,.55);align-items:center}
.panel{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--card);border:1.5px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--shadow);padding:16px;display:grid;gap:8px;text-align:center;animation:up .25s ease}
.panel p{margin:0;font-size:15px}
.ask{font:700 26px var(--hand);color:var(--ink)}
.two{display:grid;gap:8px}
.suspense{background:var(--stage);color:#fffdf6;border-color:var(--gold)}
.suspense .ask{color:var(--gold)}
.dots3{display:flex;justify-content:center;gap:8px}
.dots3 i{width:12px;height:12px;border-radius:50%;background:var(--gold);animation:blink 1s infinite}
.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.ladderpanel{text-align:left}
.won .logo b.nota{animation:pop .6s ease}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-10px;left:var(--x);width:8px;height:12px;background:var(--c);border-radius:2px;animation:fall 2.6s var(--d) ease-in infinite}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
